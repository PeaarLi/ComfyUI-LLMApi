[project]
name = "llm-api-chat"
version = "0.1.0"
description = "Call an LLM endpoint from ComfyUI with your own base URL and API key: an OpenAI chat-completions node and an Anthropic Messages node with Agent Skills, both with optional vision input and reasoning output."
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Single source of truth: ComfyUI Manager installs requirements.txt, and the
# registry build reads the same file.
dynamic = ["dependencies"]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/PearLi/ComfyUI-LLMApi"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.comfy]
PublisherId = "PearLi"
DisplayName = "LLM API Chat"
Icon = ""
# 0.37.0 is the only version this pack has been run against, so the floor states
# the verified fact rather than a guessed minimum. The newest capability used
# here is io.Autogrow (the image slots), whose nested widget translation was
# checked against comfyui-frontend-package 1.53.6. Lower bounds have NOT been
# tested.
requires-comfyui = ">=0.37.0"
